; Casbin RBAC model (ADR-0007) — the single policy decision point for
; "does this role grant this action". Domain/tenant scoping (which
; organisation or workspace a role assignment applies to) is resolved from
; live RoleAssignment/OrganisationMembership/WorkspaceMembership data before
; a request ever reaches this model — see
; services/api-gateway/src/authz/policy-engine.service.ts and
; role-resolution.ts for why: the role→action grant table below is the same
; regardless of *which* organisation or workspace a role is held in, so
; encoding scope inside the model itself would require either a policy line
; per tenant (impossible — tenants are created at runtime) or Casbin's
; built-in domain feature (rejected here as unneeded complexity — the
; product's actual multi-tenancy rule, "does a role assignment exist for
; this exact organisation or workspace", is already something the
; application must compute from the database; asking Casbin to also model
; it would be two places expressing the same rule).
;
; This keeps the part that genuinely varies only by role — what a role is
; allowed to do — as versioned data (this model plus policy.csv), reviewed
; and unit-tested in isolation, exactly as ADR-0007 requires. It is not a
; watered-down Casbin integration: it is Casbin doing the one job asked of
; it, without inventing policy surface for a scoping rule the domain layer
; already owns.

[request_definition]
r = sub, act

[policy_definition]
p = sub, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.sub == p.sub && r.act == p.act
