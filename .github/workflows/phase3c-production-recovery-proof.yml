name: Phase 3C production recovery proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-proof:
    name: Protected recovery proof (read-only database operations)
    runs-on: [self-hosted, witness-pilot]
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: phase3c-recovery-source

      - name: Execute approved recovery proof
        shell: bash
        run: |
          set -euo pipefail

          expected_host="witness-prod-01"
          actual_host="$(hostname -s 2>/dev/null || hostname)"
          [[ "$actual_host" == "$expected_host" ]] || { echo "Unexpected runner hostname; refusing recovery proof."; exit 1; }

          production_repo="/home/witness/witness"
          tooling_repo="$GITHUB_WORKSPACE/phase3c-recovery-source"
          [[ -d "$production_repo/.git" ]] || { echo "Authoritative production repository not found."; exit 1; }
          [[ -d "$tooling_repo/.git" ]] || { echo "Reviewed recovery tooling checkout not found."; exit 1; }
          [[ "$(git -C "$production_repo" symbolic-ref --short -q HEAD 2>/dev/null || true)" == "main" ]] || { echo "Production repository is not on main."; exit 1; }
          [[ "$(git -C "$production_repo" status --short | wc -l | tr -d ' ')" == "0" ]] || { echo "Production repository is not clean."; exit 1; }
          production_sha="$(git -C "$production_repo" rev-parse HEAD)"
          [[ "$(git -C "$tooling_repo" rev-parse --verify HEAD)" == "$GITHUB_SHA" ]] || { echo "Reviewed tooling checkout does not match dispatched main revision."; exit 1; }

          compose_file="$production_repo/deployments/cloud-managed/docker-compose.pilot.yml"
          reviewed_compose_file="$tooling_repo/deployments/cloud-managed/docker-compose.pilot.yml"
          env_file="$production_repo/.env"
          run_root="/home/witness/witness-backups/phase3c/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ -f "$compose_file" && -f "$env_file" ]] || { echo "Authoritative Compose or environment file is unavailable."; exit 1; }
          [[ -f "$reviewed_compose_file" ]] || { echo "Reviewed Compose definition is unavailable."; exit 1; }
          grep -q '^name: witness-pilot$' "$compose_file" || { echo "Unexpected Compose project declaration."; exit 1; }
          grep -q '^name: witness-pilot$' "$reviewed_compose_file" || { echo "Reviewed Compose project declaration differs."; exit 1; }
          services="$(cd "$production_repo" && docker compose --env-file "$env_file" -f "$compose_file" config --services)"
          reviewed_services="$(cd "$tooling_repo" && docker compose --env-file "$env_file" -f "$reviewed_compose_file" config --services)"
          grep -qx postgres <<<"$services" || { echo "Expected postgres service is unavailable."; exit 1; }
          [[ "$services" == "$reviewed_services" ]] || { echo "Reviewed and production Compose services differ."; exit 1; }
          compose_projects="$(docker compose ls --format '{{.Name}}' 2>/dev/null || true)"
          grep -qx witness-pilot <<<"$compose_projects" || { echo "Active witness-pilot Compose project is unavailable."; exit 1; }

          if [[ -e "$run_root" ]]; then echo "Recovery run directory already exists; refusing stale-artifact reuse."; exit 1; fi
          mkdir -p "$run_root" "$run_root/config" "$run_root/database" "$run_root/keycloak-config"
          chmod 700 "$run_root" "$run_root/config" "$run_root/database" "$run_root/keycloak-config"

          echo "HOST=$actual_host"
          echo "COMPOSE_PROJECT=witness-pilot"
          echo "PRODUCTION_DEPLOYMENT_SHA=$production_sha"

          export WITNESS_ENV_FILE="$env_file"
          "$tooling_repo/scripts/pilot/snapshot-env.sh" "$run_root/config" >/dev/null
          mapfile -t env_snapshots < <(find "$run_root/config" -maxdepth 1 -type f -name 'witness-env-*.snapshot' -print)
          [[ ${#env_snapshots[@]} -eq 1 ]] || { echo "Expected exactly one environment snapshot in this run."; exit 1; }
          env_snapshot="${env_snapshots[0]}"
          [[ -f "${env_snapshot}.sha256" ]] || { echo "Environment snapshot checksum is missing."; exit 1; }
          (cd "$(dirname "$env_snapshot")" && sha256sum -c "$(basename "$env_snapshot").sha256" >/dev/null)
          [[ "$(stat -c '%a' "$env_snapshot" 2>/dev/null || stat -f '%Lp' "$env_snapshot")" == "600" ]] || { echo "Environment snapshot permissions are unsafe."; exit 1; }
          echo "ENV_SNAPSHOT_CREATED=YES"
          echo "ENV_CHECKSUM_VERIFIED=YES"

          "$tooling_repo/scripts/pilot/backup.sh" "$run_root/database" >/dev/null
          mapfile -t witness_dumps < <(find "$run_root/database" -maxdepth 1 -type f -name 'witness-*.dump' -print)
          mapfile -t keycloak_dumps < <(find "$run_root/database" -maxdepth 1 -type f -name 'keycloak-*.dump' -print)
          [[ ${#witness_dumps[@]} -eq 1 && ${#keycloak_dumps[@]} -eq 1 ]] || { echo "Expected exactly one Witness and one Keycloak dump in this run."; exit 1; }
          witness_dump="${witness_dumps[0]}"
          keycloak_dump="${keycloak_dumps[0]}"
          [[ -f "${witness_dump}.sha256" && -f "${keycloak_dump}.sha256" ]] || { echo "Database backup checksum is missing."; exit 1; }
          (cd "$run_root/database" && sha256sum -c "$(basename "$witness_dump").sha256" >/dev/null && sha256sum -c "$(basename "$keycloak_dump").sha256" >/dev/null)
          echo "WITNESS_BACKUP_CREATED=YES"
          echo "WITNESS_BACKUP_CHECKSUM=VERIFIED"
          echo "WITNESS_BACKUP_SIZE=$(du -h "$witness_dump" | cut -f1)"
          echo "KEYCLOAK_BACKUP_CREATED=YES"
          echo "KEYCLOAK_BACKUP_CHECKSUM=VERIFIED"
          echo "KEYCLOAK_BACKUP_SIZE=$(du -h "$keycloak_dump" | cut -f1)"

          "$tooling_repo/scripts/pilot/export-keycloak-config.sh" "$run_root/keycloak-config" >/dev/null
          mapfile -t realm_exports < <(find "$run_root/keycloak-config" -maxdepth 1 -type f -name 'witness-realm-*.json' -print)
          mapfile -t client_exports < <(find "$run_root/keycloak-config" -maxdepth 1 -type f -name 'witness-api-client-*.json' -print)
          [[ ${#realm_exports[@]} -eq 1 && ${#client_exports[@]} -eq 1 ]] || { echo "Expected exactly one realm and client export in this run."; exit 1; }
          realm_export="${realm_exports[0]}"
          client_export="${client_exports[0]}"
          [[ -f "${realm_export}.sha256" && -f "${client_export}.sha256" ]] || { echo "Keycloak export checksum is missing."; exit 1; }
          (cd "$run_root/keycloak-config" && sha256sum -c "$(basename "$realm_export").sha256" >/dev/null && sha256sum -c "$(basename "$client_export").sha256" >/dev/null)
          echo "KEYCLOAK_REALM_EXPORT=PROVEN"
          echo "KEYCLOAK_CLIENT_EXPORT=PROVEN"
          echo "KEYCLOAK_EXPORT_CHECKSUMS=VERIFIED"

          restore_name="witness-phase3c-restore-$$"
          restore_volume="witness-phase3c-restore-data-$$"
          cleanup() {
            docker rm -f "$restore_name" >/dev/null 2>&1 || true
            docker volume rm "$restore_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$restore_volume" >/dev/null
          restore_password="phase3c-isolated-only"
          docker run -d --name "$restore_name" --network none -e POSTGRES_PASSWORD="$restore_password" --mount "type=volume,source=$restore_volume,destination=/var/lib/postgresql/data" postgres:16-alpine >/dev/null
          for _ in $(seq 1 60); do
            docker exec -e PGPASSWORD="$restore_password" "$restore_name" pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec -e PGPASSWORD="$restore_password" "$restore_name" pg_isready -U postgres >/dev/null
          docker run --rm --network container:"$restore_name" --mount "type=bind,source=$run_root/database,destination=/backup,readonly" -e PGPASSWORD="$restore_password" postgres:16-alpine pg_restore --list "/backup/$(basename "$keycloak_dump")" >/dev/null
          docker run --rm --network container:"$restore_name" --mount "type=bind,source=$run_root/database,destination=/backup,readonly" -e PGPASSWORD="$restore_password" postgres:16-alpine pg_restore --no-owner --dbname=postgresql://postgres@127.0.0.1/postgres "/backup/$(basename "$keycloak_dump")" >/dev/null
          structural_count="$(docker exec -e PGPASSWORD="$restore_password" "$restore_name" psql -U postgres -d postgres -Atqc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname NOT IN ('pg_catalog','information_schema') AND c.relkind IN ('r','p','v','m','f');")"
          [[ "$structural_count" =~ ^[1-9][0-9]*$ ]] || { echo "Isolated restore contains no restored structural objects."; exit 1; }
          echo "RESTORED_USER_TABLE_COUNT=$structural_count"
          echo "KEYCLOAK_RESTORE=PROVEN"

          echo "ANONYMOUS_VOLUMES="
          while IFS= read -r volume; do
            [[ -n "$volume" ]] || continue
            attached=""
            while IFS= read -r container; do
              [[ -n "$container" ]] || continue
              mounts="$(docker inspect --format '{{range .Mounts}}{{if eq .Type "volume"}}{{.Name}}|{{.Destination}}{{println}}{{end}}{{end}}' "$container" 2>/dev/null || true)"
              while IFS='|' read -r mounted_name destination; do
                [[ "$mounted_name" == "$volume" ]] || continue
                service="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$container" 2>/dev/null || echo unknown)"
                attached="${service}:${destination}"
              done <<<"$mounts"
            done < <(docker ps -aq)
            if [[ -n "$attached" ]]; then
              classification="ACTIVE_REQUIRED"
            else
              classification="UNKNOWN"
              attached="none"
            fi
            echo "ANONYMOUS_VOLUME=${volume:0:12} ATTACHMENT=$attached CLASSIFICATION=$classification"
          done < <(docker volume ls -q | awk 'length($0) == 64 && $0 ~ /^[0-9a-f]+$/')
          echo "CLOUDFLARE_REFRESH=NOT_AVAILABLE"
          echo "LOCAL_TUNNEL_MATCH=UNKNOWN"
          echo "PRODUCTION_CONFIG_CHANGED=NO"
          echo "APPLICATION_RESTARTED=NO"
          echo "MIGRATIONS_RUN=NO"
          echo "DNS_CHANGED=NO"
          echo "TUNNEL_CHANGED=NO"
