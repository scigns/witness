# Continuous integration — the main quality gate.
#
# Design rule (docs/engineering/CI_CD.md): no logic lives in this file. Every step
# calls a `make` target or a script that a contributor runs identically on their
# own machine. That keeps the pipeline portable off GitHub Actions, which matters
# for a project claiming sovereignty.
#
# Witness is pre-implementation, so the code gates are guarded on the presence of
# workspace source. They activate automatically in Phase 2 without editing this file.

name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"

jobs:
  detect:
    name: Detect scope
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.check.outputs.has_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        # The precondition for every code job is an INSTALLABLE workspace, not merely
        # the presence of a package.json. `actions/setup-node` with `cache: pnpm` and
        # `pnpm install --frozen-lockfile` both require a committed lockfile, so that
        # is what we gate on. Keying on package.json meant the placeholder manifests
        # in packages/* switched these jobs on before there was anything to install.
        run: |
          if [ -f pnpm-lock.yaml ] && \
             find apps packages services workers sdk -name '*.ts' -not -path '*/node_modules/*' 2>/dev/null | grep -q .; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Workspace is installable — code gates active."
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No installable workspace yet (no lockfile or no TypeScript source) — code gates skipped. See STATUS.md."
          fi

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm before setup-node: `cache: pnpm` below resolves the store path by
      # invoking pnpm, so setup-node fails if pnpm is not on PATH yet.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pinned version, not whatever npx resolves today. `npx --yes` pulled a
      # newer markdownlint than the lockfile, so a document could pass locally and
      # fail here — the exact discrepancy CI_CD.md calls a bug.
      - name: Lint markdown
        run: pnpm docs:lint
      - name: Check internal links
        run: bash scripts/ci/check-links.sh
      - name: Check document headers
        run: bash scripts/ci/check-doc-headers.sh

  governance:
    name: Repository governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every path has an owner
        run: bash scripts/ci/check-codeowners-coverage.sh
      - name: Configuration syntax (all YAML and JSON)
        run: bash scripts/ci/check-config-syntax.sh
      - name: Mandatory compose variables are documented in .env.example
        run: bash scripts/ci/check-env-example.sh
      - name: ADR governance
        run: bash scripts/ci/check-adrs.sh
      - name: Context freshness (STATUS.md / ROADMAP.md)
        run: bash scripts/ci/check-context-freshness.sh
      - name: Branch naming
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/check-branch-name.sh "${{ github.head_ref }}"

  static:
    name: Lint, format, typecheck
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache turbo build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: make format-check
      - run: make lint
      - run: make typecheck
      # ADR-0003: the domain layer imports nothing but the standard library.
      # Checked here as well as by an ESLint rule, because the ESLint rule is a
      # denylist and this is the inverse — it catches a dependency nobody thought
      # to add to the list.
      - name: Domain purity (ADR-0003)
        run: bash scripts/ci/check-domain-purity.sh

  test:
    name: Test
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache turbo build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Unit and integration tests
        run: make test
      - name: Contract tests
        run: pnpm test:contract

  invariants:
    name: Invariants and adversarial
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache turbo build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      # INV-1..INV-8: consent, provenance, tenant isolation, layering, projection rebuild.
      # These encode what Witness promises. A weakened assertion here is the loudest
      # possible signal in code review.
      #
      # The suites import the workspace packages by name, which resolve to dist/.
      # `pnpm test:invariants` builds first so the command is correct standalone;
      # this job would otherwise fail on a fresh checkout while passing on any
      # machine that had built at some point.
      - name: Invariant suite
        run: pnpm test:invariants
      - name: Adversarial suite
        run: pnpm test:adversarial
      - name: Infrastructure contract tests
        run: pnpm test:infrastructure

  # Real Postgres and Neo4j, disposable per run — the same suites a
  # contributor runs locally via `pnpm --filter <pkg> test:live` against
  # `make dev-integration`, now proven to pass somewhere that is not one
  # laptop's Docker install (docs/engineering/DEVELOPMENT_ENVIRONMENTS.md).
  # Each service container is destroyed when the job ends; nothing here is
  # ever reused between runs, so a stale local volume can never be the
  # reason a live suite passes in CI but not for a new contributor.
  integration:
    name: Integration (live Postgres + Neo4j)
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: witness
          POSTGRES_USER: witness
          POSTGRES_PASSWORD: witness-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U witness -d witness"
          --health-interval 10s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/witness-ci-only
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 10s --health-retries 15
    env:
      DATABASE_URL: postgresql://witness:witness-ci-only@localhost:5432/witness?schema=public
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: witness-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache turbo build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Build workspace packages
        run: pnpm turbo run build --filter=@witness/api --filter=@witness/knowledge-graph --filter=@witness/graph-projector
      - name: Apply database migrations
        run: pnpm --filter @witness/api exec prisma migrate deploy
      - name: API live suite (real Postgres)
        run: pnpm --filter @witness/api test:live
      - name: Knowledge graph live suite (real Neo4j)
        run: pnpm --filter @witness/knowledge-graph test:live
      - name: Graph projector live suite (real Postgres + Neo4j)
        run: pnpm --filter @witness/graph-projector test:live

  build:
    name: Build
    needs: [detect, static]
    if: needs.detect.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache turbo build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: make build
      - name: Bundle size budget
        run: bash scripts/ci/check-bundle-size.sh

  gate:
    name: CI gate
    if: always()
    needs: [docs, governance, static, test, invariants, integration, build]
    runs-on: ubuntu-latest
    steps:
      - name: Assert no required job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not pass. We do not disable gates to go green."
              exit 1
            fi
          done
