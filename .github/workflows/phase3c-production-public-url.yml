name: Phase 3C production Witness public URL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-public-url:
    name: Verify or set production public URL
    runs-on: [self-hosted, witness-pilot]
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Verify or set one production environment value
        shell: bash
        run: |
          set -euo pipefail

          expected_host="witness-prod-01"
          actual_host="$(hostname -s 2>/dev/null || hostname)"
          [[ "$actual_host" == "$expected_host" ]] || { echo "Unexpected runner hostname; refusing environment change."; exit 1; }
          [[ "${GITHUB_REF:-}" == "refs/heads/main" ]] || { echo "Environment change must be dispatched from main."; exit 1; }

          production_repo="/home/witness/witness"
          env_file="$production_repo/.env"
          compose_file="$production_repo/deployments/cloud-managed/docker-compose.pilot.yml"
          expected_sha="${GITHUB_SHA}"
          expected_value="https://buildwithwitness.com"
          [[ -d "$production_repo/.git" && -f "$env_file" && -f "$compose_file" ]] || { echo "Authoritative production files unavailable."; exit 1; }
          [[ "$(git -C "$production_repo" rev-parse HEAD)" == "$expected_sha" ]] || { echo "Production source is not the dispatched main revision."; exit 1; }
          [[ -f "$env_file" && ! -L "$env_file" ]] || { echo "Production .env must be a regular file."; exit 1; }
          if git -C "$production_repo" ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Production .env must remain untracked."
            exit 1
          fi
          grep -qF 'WITNESS_PUBLIC_URL: ${WITNESS_PUBLIC_URL:?WITNESS_PUBLIC_URL must be set}' "$compose_file" || { echo "Reviewed Compose public URL mapping is missing."; exit 1; }

          mode_before="$(stat -c '%a' "$env_file" 2>/dev/null || stat -f '%Lp' "$env_file")"
          before_without_target="$(mktemp)"
          after_without_target="$(mktemp)"
          temp_file="$(mktemp "${env_file}.tmp.XXXXXX")"
          cleanup() { rm -f "$before_without_target" "$after_without_target" "$temp_file"; }
          trap cleanup EXIT

          # Count and inspect only the target key; values are never printed.
          target_count="$(awk '/^[[:space:]]*WITNESS_PUBLIC_URL=/ { count++ } END { print count + 0 }' "$env_file")"
          [[ "$target_count" -le 1 ]] || { echo "Multiple WITNESS_PUBLIC_URL entries are not permitted."; exit 1; }
          current_value="$(awk -F= '/^[[:space:]]*WITNESS_PUBLIC_URL=/ { sub(/^[[:space:]]*/, "", $1); print substr($0, index($0, "=") + 1) }' "$env_file")"

          awk '!/^[[:space:]]*WITNESS_PUBLIC_URL=/' "$env_file" >"$before_without_target"
          if [[ "$target_count" == "1" && "$current_value" == "$expected_value" ]]; then
            echo "WITNESS_PUBLIC_URL=VALID"
          else
            awk -v value="$expected_value" '
              BEGIN { replaced = 0 }
              /^[[:space:]]*WITNESS_PUBLIC_URL=/ { print "WITNESS_PUBLIC_URL=" value; replaced = 1; next }
              { print }
              END { if (!replaced) print "WITNESS_PUBLIC_URL=" value }
            ' "$env_file" >"$temp_file"
            chmod "$mode_before" "$temp_file"
            mv "$temp_file" "$env_file"
            echo "WITNESS_PUBLIC_URL=FIXED"
          fi

          mode_after="$(stat -c '%a' "$env_file" 2>/dev/null || stat -f '%Lp' "$env_file")"
          [[ "$mode_before" == "$mode_after" ]] || { echo "Production .env permissions changed unexpectedly."; exit 1; }
          target_count_after="$(awk '/^[[:space:]]*WITNESS_PUBLIC_URL=/ { count++ } END { print count + 0 }' "$env_file")"
          current_value_after="$(awk -F= '/^[[:space:]]*WITNESS_PUBLIC_URL=/ { print substr($0, index($0, "=") + 1) }' "$env_file")"
          [[ "$target_count_after" == "1" && "$current_value_after" == "$expected_value" ]] || { echo "WITNESS_PUBLIC_URL postcondition failed."; exit 1; }
          awk '!/^[[:space:]]*WITNESS_PUBLIC_URL=/' "$env_file" >"$after_without_target"
          cmp -s "$before_without_target" "$after_without_target" || { echo "An unrelated environment value changed."; exit 1; }
          [[ -z "$(git -C "$production_repo" diff --cached --name-status)" ]] || { echo "Unexpected staged production changes."; exit 1; }

          echo "APPLICATION_RESTARTED=NO"
          echo "DATABASE_CHANGED=NO"
          echo "DNS_CHANGED=NO"
          echo "CLOUDFLARE_CHANGED=NO"
          echo "OTHER_ENV_VALUES_CHANGED=NO"
