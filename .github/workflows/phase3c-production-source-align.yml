name: Phase 3C production source alignment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  align:
    name: Align reviewed production source
    runs-on: [self-hosted, witness-pilot]
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed main tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: phase3c-source-align
          persist-credentials: false
          clean: true

      - name: Align production source (single tracked file exception)
        shell: bash
        run: |
          set -euo pipefail

          expected_host="witness-prod-01"
          actual_host="$(hostname -s 2>/dev/null || hostname)"
          [[ "$actual_host" == "$expected_host" ]] || { echo "Unexpected runner hostname; refusing source alignment."; exit 1; }
          [[ "${GITHUB_REF:-}" == "refs/heads/main" ]] || { echo "Source alignment must be dispatched from main."; exit 1; }

          production_repo="/home/witness/witness"
          reviewed_repo="$GITHUB_WORKSPACE/phase3c-source-align"
          relative_file="deployments/cloud-managed/cloudflared/config.yml"
          production_file="$production_repo/$relative_file"
          env_file="$production_repo/.env"
          target_sha="${GITHUB_SHA}"

          [[ -d "$production_repo/.git" && -f "$env_file" && -f "$production_file" ]] || { echo "Authoritative production repository, .env, or cloudflared config unavailable."; exit 1; }
          [[ "$(git -C "$production_repo" symbolic-ref --short -q HEAD 2>/dev/null || true)" == "main" ]] || { echo "Production repository is not on main."; exit 1; }
          if git -C "$production_repo" ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Production .env must remain untracked."
            exit 1
          fi

          mapfile -t dirty_entries < <(git -C "$production_repo" status --porcelain=v1)
          [[ ${#dirty_entries[@]} -eq 1 && "${dirty_entries[0]}" == " M $relative_file" ]] || { echo "Production worktree precondition failed."; exit 1; }
          [[ -z "$(git -C "$production_repo" diff --cached --name-status)" ]] || { echo "Staged production changes are not permitted."; exit 1; }

          # shellcheck disable=SC2016
          tunnel_value="$(awk '$1 == "tunnel:" { count++; value=$2 } END { if (count == 1) print value }' "$production_file")"
          [[ "$tunnel_value" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "Production tunnel declaration is not a single UUID-shaped value."; exit 1; }

          reviewed_file="$reviewed_repo/$relative_file"
          [[ -f "$reviewed_file" ]] || { echo "Reviewed cloudflared config unavailable."; exit 1; }
          [[ "$(git -C "$reviewed_repo" rev-parse HEAD)" == "$target_sha" ]] || { echo "Reviewed checkout is not the approved main revision."; exit 1; }
          reviewed_placeholder='${CLOUDFLARE_TUNNEL_ID}'
          # shellcheck disable=SC2016
          [[ "$(awk '$1 == "tunnel:" { count++; value=$2 } END { print count ":" value }' "$reviewed_file")" == "1:$reviewed_placeholder" ]] || { echo "Reviewed tunnel placeholder precondition failed."; exit 1; }
          for hostname in witness-prod-web.pacificdigitalconsultancy.org witness-prod-api.pacificdigitalconsultancy.org witness-prod-id.pacificdigitalconsultancy.org; do
            grep -qF "$hostname" "$reviewed_file" || { echo "Reviewed legacy hostname baseline is incomplete."; exit 1; }
          done
          grep -qF 'WITNESS_PUBLIC_URL: ${WITNESS_PUBLIC_URL:?WITNESS_PUBLIC_URL must be set}' "$reviewed_repo/deployments/cloud-managed/docker-compose.pilot.yml" || { echo "Reviewed Compose product URL mapping is missing."; exit 1; }
          if grep -Eiq '^[[:space:]]*(hostname|service):.*postgres' "$reviewed_file"; then echo "PostgreSQL ingress is not permitted."; exit 1; fi

          # shellcheck disable=SC2016
          env_hash_before="$(sha256sum "$env_file" | awk '{print $1}')"
          temp_file="$(mktemp)"
          cleanup() { rm -f "$temp_file" "${temp_file}.normalized" "${reviewed_file}.normalized"; }
          trap cleanup EXIT

          git -C "$production_repo" fetch --quiet origin "$target_sha"
          git -C "$production_repo" reset --hard --quiet "$target_sha"
          [[ "$(git -C "$production_repo" rev-parse HEAD)" == "$target_sha" ]] || { echo "Production source did not reach the approved revision."; exit 1; }

          awk -v tunnel="$tunnel_value" '
            $1 == "tunnel:" { if (++count == 1) { print "tunnel: " tunnel; next } }
            { print }
            END { if (count != 1) exit 1 }
          ' "$production_file" >"$temp_file"
          chmod 600 "$temp_file"
          mv "$temp_file" "$production_file"

          # shellcheck disable=SC2016
          env_hash_after="$(sha256sum "$env_file" | awk '{print $1}')"
          [[ "$env_hash_before" == "$env_hash_after" ]] || { echo "Production .env changed unexpectedly."; exit 1; }

          canonicalize() {
            awk '
              { line=$0; sub(/[[:space:]]+$/, "", line); trimmed=line; sub(/^[[:space:]]+/, "", trimmed); if (trimmed == "" || trimmed ~ /^#/) next; if (trimmed ~ /^tunnel:[[:space:]]/) { match(line, /^[[:space:]]*/); line=substr(line,1,RLENGTH) "tunnel: __DEPLOYMENT_TUNNEL__" } print line }
            ' "$1" >"$2"
          }
          canonicalize "$reviewed_file" "${reviewed_file}.normalized"
          canonicalize "$production_file" "${temp_file}.normalized"
          cmp -s "${reviewed_file}.normalized" "${temp_file}.normalized" || { echo "CLOUDFLARED_EFFECTIVE_CONFIG=INVALID"; exit 1; }

          mapfile -t final_dirty < <(git -C "$production_repo" status --porcelain=v1)
          [[ ${#final_dirty[@]} -eq 1 && "${final_dirty[0]}" == " M $relative_file" ]] || { echo "Post-alignment worktree state is unexpected."; exit 1; }
          [[ -z "$(git -C "$production_repo" diff --cached --name-status)" ]] || { echo "Unexpected staged changes after alignment."; exit 1; }
          # shellcheck disable=SC2016
          [[ "$(awk '$1 == "tunnel:" { count++; value=$2 } END { print count ":" value }' "$production_file" | cut -d: -f1)" == "1" ]] || { echo "Post-alignment tunnel declaration is invalid."; exit 1; }

          echo "HOST=$actual_host"
          echo "PRODUCTION_HEAD=$target_sha"
          echo "ENV_CHANGED=NO"
          echo "CLOUDFLARED_EFFECTIVE_CONFIG=VALID"
          echo "APPLICATION_RESTARTED=NO"
          echo "DATABASE_CHANGED=NO"
          echo "DNS_CHANGED=NO"
          echo "CLOUDFLARE_CHANGED=NO"
