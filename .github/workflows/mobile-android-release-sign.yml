# Witness Participate — Android release signing.
#
# Separate from mobile-android.yml deliberately (per that workflow's own
# comment): the build job runs on every mobile-relevant PR with no
# deployment permission and must never see signing secrets. This job is
# workflow_dispatch-only, downloads the exact unsigned AAB an already-green
# mobile-android.yml run produced (never rebuilds — same provenance
# discipline mobile-android-cloud.yml uses), and jarsigns that same file.
# AABs don't need zipalign (that only applies to APKs Play generates from
# the AAB later), so no Android SDK/build-tools are needed here — a JDK's
# own jarsigner is sufficient.
#
# Skips gracefully, not a hard failure, when the four ANDROID_RELEASE_*
# secrets aren't configured yet — see scripts/mobile/
# generate-android-release-keystore.sh for the exact human steps that
# create them. No keystore or password is ever written to this
# repository; the decoded keystore file lives only in the ephemeral
# runner's temp directory for this one job.

name: Mobile — Android release signing

on:
  workflow_dispatch:
    inputs:
      android_build_run_id:
        description: "mobile-android.yml run ID to pull the unsigned AAB from. Leave blank to use the latest successful run on this ref."
        required: false
        type: string

permissions:
  contents: read

jobs:
  sign:
    name: Sign release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Probe signing secrets
        id: probe
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
          HAS_KEYSTORE_PW: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS != '' }}
          HAS_KEY_PW: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ] && [ "$HAS_KEYSTORE_PW" = "true" ] && [ "$HAS_ALIAS" = "true" ] && [ "$HAS_KEY_PW" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Android release signing skipped::ANDROID_RELEASE_KEYSTORE_BASE64/_PASSWORD, ANDROID_RELEASE_KEY_ALIAS and/or ANDROID_RELEASE_KEY_PASSWORD secrets are not set. See scripts/mobile/generate-android-release-keystore.sh."
          fi

      - name: Resolve Android build run
        if: steps.probe.outputs.configured == 'true'
        id: build_run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.android_build_run_id }}
        run: |
          if [ -n "$INPUT_RUN_ID" ]; then
            run_id="$INPUT_RUN_ID"
          else
            run_id=$(gh run list --repo "${{ github.repository }}" --branch "${{ github.ref_name }}" \
              --workflow "Mobile — Android" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful Mobile — Android run found for ${{ github.ref_name }}. Run that workflow first."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the unsigned release AAB
        if: steps.probe.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p aab
          gh run download "${{ steps.build_run.outputs.run_id }}" --repo "${{ github.repository }}" \
            --pattern '*-release-unsigned-aab' --dir aab
          src=$(find aab -name '*.aab' | head -1)
          test -s "$src"
          echo "SRC_AAB=$src" >> "$GITHUB_ENV"
          sha256sum "$src"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.probe.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode keystore and sign
        if: steps.probe.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          cp "$SRC_AAB" signed.aab
          jarsigner -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            signed.aab "$KEY_ALIAS"
          jarsigner -verify signed.aab
          shred -u "$keystore" 2>/dev/null || rm -f "$keystore"
          sha256sum signed.aab

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.probe.outputs.configured == 'true'
        with:
          name: witness-participate-release-signed-aab
          path: signed.aab
          retention-days: 14
          if-no-files-found: error
