# Production cutover for www.buildwithwitness.com: two separate,
# manually-triggered workflows in this one file, run independently --
# "preflight" (read-only) is always run and reviewed first; "apply" (the
# only job that changes anything) is only run afterwards, deliberately, in
# its own dispatch.
#
# Context: docs/operations/witness-website-recovery-2026-10-14.md, section 13.
#
# This uses Cloudflare's own Pages Custom Domains API
# (POST .../pages/projects/{name}/domains), the supported mechanism behind
# the dashboard's "Add Custom Domain" button -- not a hand-crafted DNS
# record. Cloudflare provisions/updates the DNS record and certificate for
# the hostname as part of this call.
#
# Scope: only ever touches www.buildwithwitness.com. Never app./api./id./
# preview -- those hostnames do not appear anywhere in this file.

name: Cutover www.buildwithwitness.com to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      action:
        description: "preflight (read-only) / apply (adds the custom domain) / diagnose (read-only, GET-only -- investigates a 522/timeout after cutover)"
        required: true
        type: choice
        options:
          - preflight
          - apply
          - diagnose

permissions:
  contents: read

concurrency:
  group: cutover-www-custom-domain
  cancel-in-progress: false

jobs:
  preflight:
    name: Pre-flight checks (read-only)
    if: inputs.action == 'preflight'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Confirm Pages project, production branch, and deployed commit
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/witness-marketing")
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Could not read the witness-marketing Pages project."
            echo "$RESPONSE" | jq '.errors'
            exit 1
          fi
          SUMMARY=$(echo "$RESPONSE" | jq '{
            name: .result.name,
            production_branch: .result.production_branch,
            existing_domains: .result.domains,
            latest_deployment_url: .result.latest_deployment.url,
            latest_deployment_branch: .result.latest_deployment.deployment_trigger.metadata.branch,
            latest_deployment_commit: .result.latest_deployment.deployment_trigger.metadata.commit_hash,
            latest_deployment_created_on: .result.latest_deployment.created_on,
            latest_deployment_env: .result.latest_deployment.environment
          }')
          echo "$SUMMARY"
          {
            echo "## Pages project state"
            echo '```json'
            echo "$SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          BRANCH=$(echo "$RESPONSE" | jq -r '.result.production_branch')
          if [ "$BRANCH" != "main" ]; then
            echo "::warning::Production branch is '$BRANCH', not 'main'."
          fi
          DOMAIN_COUNT=$(echo "$RESPONSE" | jq '.result.domains | length')
          if [ "$DOMAIN_COUNT" != "0" ]; then
            echo "::warning::Project already has custom domain(s) attached: $(echo "$RESPONSE" | jq -c '.result.domains')"
          fi

      - name: Record current public state of www and apex (for the rollback record)
        run: |
          set -euo pipefail
          {
            echo "## Pre-cutover public state"
            echo '```'
            echo "apex (buildwithwitness.com):"
            curl -sS -D - -o /dev/null --max-time 10 https://buildwithwitness.com/ | head -5 || true
            echo
            echo "www.buildwithwitness.com:"
            curl -sS -D - -o /dev/null --max-time 10 https://www.buildwithwitness.com/ | head -5 || true
            echo
            echo "www public DNS answer:"
            dig +short www.buildwithwitness.com || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Attach www.buildwithwitness.com as a Pages Custom Domain
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Add the custom domain
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"www.buildwithwitness.com"}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/witness-marketing/domains")
          echo "$RESPONSE" | jq '.'
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Adding the custom domain failed -- nothing else in this workflow attempts a fix or a retry."
            exit 1
          fi

      - name: Confirm domain status
        run: |
          set -euo pipefail
          sleep 5
          RESPONSE=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/witness-marketing/domains/www.buildwithwitness.com")
          echo "$RESPONSE" | jq '.'

  diagnose:
    name: Diagnose www routing (read-only, GET only)
    if: inputs.action == 'diagnose'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Non-secret: Cloudflare zone ID for buildwithwitness.com, surfaced in
      # the apply job's own domain-creation response (zone_tag field).
      ZONE_ID: "3d70bf17f3dc9541ba8ca2de25e87d2a"
    steps:
      - name: Pages custom-domain validation and certificate status
        run: |
          set -uo pipefail
          RESPONSE=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/witness-marketing/domains/www.buildwithwitness.com")
          echo "$RESPONSE" | jq '.'

      - name: Zone DNS record for www (requires Zone:DNS:Read -- may be out of this token's scope)
        run: |
          set -uo pipefail
          RESPONSE=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=www.buildwithwitness.com")
          echo "$RESPONSE" | jq '.'

      - name: Zone Worker routes (requires Zone:Workers Routes:Read -- may be out of scope)
        run: |
          set -uo pipefail
          RESPONSE=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes")
          echo "$RESPONSE" | jq '.'

      - name: Zone rulesets -- redirect rules and origin rules phases (requires Zone:Rulesets:Read -- may be out of scope)
        run: |
          set -uo pipefail
          echo "--- entrypoint: http_request_dynamic_redirect ---"
          curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets/phases/http_request_dynamic_redirect/entrypoint" | jq '.'
          echo "--- entrypoint: http_request_origin ---"
          curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets/phases/http_request_origin/entrypoint" | jq '.'

      - name: Account Cloudflare Tunnels and witness-prod ingress (requires Account:Cloudflare Tunnel:Read -- may be out of scope)
        run: |
          set -uo pipefail
          TUNNELS=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/cfd_tunnel?is_deleted=false")
          echo "$TUNNELS" | jq '.'
          TUNNEL_ID=$(echo "$TUNNELS" | jq -r '.result[]? | select(.name | test("witness-prod"; "i")) | .id' | head -1)
          if [ -n "${TUNNEL_ID:-}" ]; then
            echo "--- witness-prod tunnel ($TUNNEL_ID) ingress configuration ---"
            curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/cfd_tunnel/${TUNNEL_ID}/configurations" | jq '.'
          fi

      - name: Live public state of www, apex, and the Pages preview
        run: |
          set -uo pipefail
          echo "--- www.buildwithwitness.com ---"
          curl -sS -D - -o /dev/null --max-time 10 https://www.buildwithwitness.com/ | head -8
          echo "--- buildwithwitness.com (apex) ---"
          curl -sS -D - -o /dev/null --max-time 10 https://buildwithwitness.com/ | head -6
          echo "--- witness-marketing-7un.pages.dev ---"
          curl -sS -D - -o /dev/null --max-time 10 https://witness-marketing-7un.pages.dev/ | head -6
