name: Stale

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 30
          days-before-close: 14
          # Closing is not a judgement on the reporter. A backlog that only grows
          # is a list of things we are quietly not doing.
          stale-issue-message: >
            This issue has had no activity for 30 days. If it is still relevant,
            comment to keep it open — reopening is always welcome and closing
            here is housekeeping, not a decision that it does not matter.
          stale-pr-message: >
            This pull request has had no activity for 30 days. Comment to keep it
            open. If you are blocked or need help, say so — that is not a failure.
          exempt-issue-labels: "P0,P1,type:security,type:adr,help wanted,good first issue,blocked"
          exempt-pr-labels: "P0,P1,type:security"
          exempt-all-milestones: true
