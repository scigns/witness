# A maintainer-created full-SHA tag approves artifact publication ONLY, not deployment.
# Untrusted PR jobs have no package write token. This job imports validated CI bytes.
name: Release artifacts

on:
  push:
    tags: ["witness-artifact-*"]

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'scigns/witness' && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # Read the exact CI artifact and gate evidence across runs.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify trusted tag and exact-SHA remote gates
        id: gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release/publication.py gates
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: witness-images-${{ github.sha }}-${{ steps.gates.outputs.ci_attempt }}
          run-id: ${{ steps.gates.outputs.ci_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-artifacts
      - name: Publish validated bytes and immutable manifest (no build)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          EXPECTED_CI_RUN: ${{ steps.gates.outputs.ci_run }}
          EXPECTED_CI_ATTEMPT: ${{ steps.gates.outputs.ci_attempt }}
        run: python3 scripts/release/publication.py publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: witness-release-${{ github.sha }}
          path: release-artifacts/release-manifest.json
          retention-days: 90
          if-no-files-found: error
