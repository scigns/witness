# Intentionally disabled during the current release hold. Manual exact-artifact deployment only.
name: Deploy pilot

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact approved SHA from the publication manifest
        required: true
      artifact_run_id:
        description: Approved successful Release artifacts run ID
        required: true

permissions:
  contents: read
  actions: read # Retrieve approved manifest from a specific publication run.
  packages: read # Ephemeral registry read token only, no permanent host credential.

concurrency:
  group: deploy-pilot
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, witness-pilot]
    environment: pilot
    timeout-minutes: 20
    steps:
      - name: Refuse unapproved workflow inputs before checkout
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
          REQUESTED_RUN: ${{ inputs.artifact_run_id }}
          APPROVED_SHA: ${{ vars.WITNESS_APPROVED_RELEASE_SHA }}
          APPROVED_RUN: ${{ vars.WITNESS_APPROVED_ARTIFACT_RUN_ID }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ && "$REQUESTED_RUN" =~ ^[0-9]+$ ]]
          [[ "$REQUESTED_SHA" == "$APPROVED_SHA" && "$REQUESTED_RUN" == "$APPROVED_RUN" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          clean: false # Preserve runner-local operator configuration; never clean unrelated work.
          persist-credentials: false
      - name: Verify successful publication provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITNESS_APPROVED_RELEASE_SHA: ${{ vars.WITNESS_APPROVED_RELEASE_SHA }}
          WITNESS_APPROVED_ARTIFACT_RUN_ID: ${{ vars.WITNESS_APPROVED_ARTIFACT_RUN_ID }}
        run: python3 scripts/release/publication.py release-run
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: witness-release-${{ inputs.release_sha }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input
      - name: Pull approved artifacts and deploy (no compilation)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          WITNESS_PILOT_API_URL: ${{ vars.WITNESS_PILOT_API_URL }}
          WITNESS_PILOT_WEB_URL: ${{ vars.WITNESS_PILOT_WEB_URL }}
          WITNESS_ENV_FILE: /home/witness/witness/.env
          WITNESS_RELEASE_MANIFEST: release-input/release-manifest.json
          WITNESS_APPROVED_RELEASE_SHA: ${{ vars.WITNESS_APPROVED_RELEASE_SHA }}
          WITNESS_APPROVED_ARTIFACT_RUN_ID: ${{ vars.WITNESS_APPROVED_ARTIFACT_RUN_ID }}
          WITNESS_APPROVED_API_IMAGE: ${{ vars.WITNESS_APPROVED_API_IMAGE }}
          WITNESS_APPROVED_WEB_IMAGE: ${{ vars.WITNESS_APPROVED_WEB_IMAGE }}
          WITNESS_APPROVED_ROLLBACK_RELEASE_SHA: ${{ vars.WITNESS_APPROVED_ROLLBACK_RELEASE_SHA }}
          WITNESS_APPROVED_ROLLBACK_API_IMAGE: ${{ vars.WITNESS_APPROVED_ROLLBACK_API_IMAGE }}
          WITNESS_APPROVED_ROLLBACK_WEB_IMAGE: ${{ vars.WITNESS_APPROVED_ROLLBACK_WEB_IMAGE }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'docker logout ghcr.io >/dev/null; rm -f "$DOCKER_CONFIG/config.json"; rmdir "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          bash scripts/pilot/deploy.sh
      - name: Diagnose Keycloak recovery email
        continue-on-error: true
        env:
          WITNESS_ENV_FILE: /home/witness/witness/.env
          WITNESS_API_IMAGE: ${{ vars.WITNESS_APPROVED_API_IMAGE }}
          WITNESS_WEB_IMAGE: ${{ vars.WITNESS_APPROVED_WEB_IMAGE }}
        run: bash scripts/pilot/reconcile-keycloak-email.sh check
