name: Phase 3C production worktree drift diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Read-only production Git metadata
    runs-on: [self-hosted, witness-pilot]
    timeout-minutes: 10
    steps:
      - name: Inspect authoritative production worktree
        shell: bash
        run: |
          set -euo pipefail

          [[ "${GITHUB_REF:-}" == "refs/heads/main" ]] || { echo "Diagnostic must be dispatched from main; refusing inspection."; exit 1; }
          expected_host="witness-prod-01"
          actual_host="$(hostname -s 2>/dev/null || hostname)"
          [[ "$actual_host" == "$expected_host" ]] || { echo "Unexpected runner hostname; refusing inspection."; exit 1; }

          production_repo="/home/witness/witness"
          [[ -d "$production_repo/.git" ]] || { echo "Production repository is unavailable."; exit 1; }
          [[ "$(git -C "$production_repo" rev-parse --is-inside-work-tree 2>/dev/null)" == true ]] || { echo "Production path is not a Git worktree."; exit 1; }

          echo "HOST=$actual_host"
          echo "PRODUCTION_REPOSITORY=$production_repo"
          echo "PRODUCTION_BRANCH=$(git -C "$production_repo" symbolic-ref --short -q HEAD 2>/dev/null || echo detached)"
          echo "PRODUCTION_HEAD=$(git -C "$production_repo" rev-parse HEAD)"
          echo "CURRENT_GITHUB_MAIN_SHA=$GITHUB_SHA"
          if git -C "$production_repo" rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "PRODUCTION_ORIGIN_MAIN=$(git -C "$production_repo" rev-parse origin/main)"
            relationship="$(git -C "$production_repo" rev-list --left-right --count origin/main...HEAD)"
            echo "ORIGIN_MAIN_RELATIONSHIP=$relationship"
          else
            echo "PRODUCTION_ORIGIN_MAIN=UNAVAILABLE"
            echo "ORIGIN_MAIN_RELATIONSHIP=UNKNOWN"
          fi

          dirty_count="$(git -C "$production_repo" status --porcelain=v1 | wc -l | tr -d ' ')"
          echo "DIRTY_ENTRY_COUNT=$dirty_count"

          redact_path() {
            local path="$1" lower
            lower="$(printf '%s' "$path" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              *.env|*.env.*|*credential*|*secret*|*private*|*.pem|*.key|*password*|*token*|*backup*|*.dump|*.sql|*database*)
                printf '%s' "SENSITIVE_PATH_REDACTED" ;;
              *) printf '%s' "$path" ;;
            esac
          }

          emit_change() {
            local status="$1" source="$2" destination="${3:-}"
            if [[ "$status" == R* || "$status" == C* ]]; then
              printf 'STATUS=%s SOURCE_PATH=%s DESTINATION_PATH=%s\n' "$status" "$(redact_path "$source")" "$(redact_path "$destination")"
            else
              printf 'STATUS=%s PATH=%s\n' "$status" "$(redact_path "$source")"
            fi
          }

          echo "DIRTY_ENTRIES="
          git -C "$production_repo" status --porcelain=v1 | while IFS= read -r entry; do
            code="${entry:0:2}"
            path="${entry:3}"
            if [[ "$code" == R* || "$code" == C* ]] && [[ "$path" == *' -> '* ]]; then
              emit_change "$code" "${path%% -> *}" "${path#* -> }"
            else
              emit_change "$code" "$path"
            fi
          done

          echo "UNSTAGED_TRACKED_ENTRIES="
          git -C "$production_repo" diff --name-status --find-renames | while IFS=$'\t' read -r status source destination; do
            [[ -n "$source" ]] || continue
            emit_change "$status" "$source" "$destination"
          done
          echo "STAGED_ENTRIES="
          git -C "$production_repo" diff --cached --name-status --find-renames | while IFS=$'\t' read -r status source destination; do
            [[ -n "$source" ]] || continue
            emit_change "$status" "$source" "$destination"
          done
          echo "UNTRACKED_ENTRIES="
          git -C "$production_repo" ls-files --others --exclude-standard | while IFS= read -r path; do
            echo "PATH=$(redact_path "$path")"
          done
          echo "FILE_CONTENTS_READ=NO"
          echo "PRODUCTION_ACTIONS=NONE"
          echo "RECOVERY_WORKFLOW_RERUN=NO"
