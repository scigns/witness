# Deploy the app.buildwithwitness.com maintenance-fallback Worker.
#
# See deployments/cloud-managed/cloudflare-worker-maintenance/README.md.
# Manual trigger only, and the committed wrangler.toml ships with its
# `[[routes]]` block commented out -- this workflow, by itself, never binds
# the Worker to the production app host or changes what
# app.buildwithwitness.com serves. Binding the route is a separate,
# explicitly approved edit to wrangler.toml, done before re-running this.
#
# Three independently-dispatched actions, same pattern as
# cutover-www-custom-domain.yml, never auto-chained:
#   create-kv  Creates the Workers KV namespace this Worker's MODE toggle
#              lives in. Safe to run once; re-running after the namespace
#              already exists just reports the existing one (wrangler's own
#              behaviour, not a wrapper around it).
#   deploy     Publishes the Worker to its own *.workers.dev URL only --
#              wrangler.toml's route stays commented out regardless of this
#              action, so app.buildwithwitness.com is never touched by it.
#   set-mode   Writes the single MODE key (off/maintenance/auto) in the KV
#              namespace. Takes effect immediately, no redeploy -- and since
#              no route is bound yet, this only ever affects the Worker's own
#              *.workers.dev URL, never app.buildwithwitness.com.
#
# Uses a pinned wrangler version invoked directly via npx rather than
# cloudflare/wrangler-action, which auto-detects this repo as a pnpm
# workspace and tries to self-install wrangler with `pnpm add` at the
# workspace root -- pnpm refuses that outright (ERR_PNPM_ADDING_TO_ROOT), the
# exact failure fixed the same way for deploy-marketing-pages.yml (PR #274).

name: Deploy maintenance worker

on:
  workflow_dispatch:
    inputs:
      action:
        description: "create-kv / deploy / set-mode / get-mode (read-only) / diagnose-subdomain (read-only, GET only)"
        required: true
        type: choice
        options:
          - create-kv
          - deploy
          - set-mode
          - get-mode
          - diagnose-subdomain
      mode:
        description: "set-mode only: off / maintenance / auto"
        required: false
        type: choice
        options:
          - "off"
          - maintenance
          - auto
        default: "off"

permissions:
  contents: read

concurrency:
  group: deploy-maintenance-worker
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  WRANGLER_VERSION: "4.151.0"

jobs:
  create-kv:
    name: Create the Workers KV namespace
    if: inputs.action == 'create-kv'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: wrangler kv namespace create
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" kv namespace create witness-maintenance-mode
          echo "::notice::Copy the 'id' value above into wrangler.toml's [[kv_namespaces]] block (non-secret) before running 'deploy'."

  deploy:
    name: Publish to *.workers.dev (no production route)
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: wrangler deploy
        working-directory: deployments/cloud-managed/cloudflare-worker-maintenance
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy

  set-mode:
    name: Write MODE to KV (workers.dev scope only -- no route bound)
    if: inputs.action == 'set-mode'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: wrangler kv key put MODE
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" kv key put MODE "${{ inputs.mode }}" \
            --namespace-id=92c270465033494e8c167e2e281bc473 --remote
          echo "::notice::MODE set to '${{ inputs.mode }}'. No route is bound to app.buildwithwitness.com, so this only affects the Worker's own *.workers.dev URL."

  get-mode:
    name: Read current MODE from KV (read-only)
    if: inputs.action == 'get-mode'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: wrangler kv key get MODE
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" kv key get MODE \
            --namespace-id=92c270465033494e8c167e2e281bc473 --remote

  diagnose-subdomain:
    name: Diagnose why the workers.dev route 404s (read-only, GET only)
    if: inputs.action == 'diagnose-subdomain'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Account workers.dev subdomain setting
        run: |
          set -uo pipefail
          curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" | jq '.'

      - name: witness-maintenance script's own subdomain-enabled setting
        run: |
          set -uo pipefail
          curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/witness-maintenance/subdomain" | jq '.'

      - name: Script settings (bindings, compatibility, etc.)
        run: |
          set -uo pipefail
          curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/witness-maintenance/settings" | jq '.'
