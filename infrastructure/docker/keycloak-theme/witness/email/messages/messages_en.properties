# Witness Brand Book v1.0 voice (docs/brand/) for the two email flows Witness
# actually triggers today: password reset and email verification (both
# link-based). Every other key is intentionally left unoverridden so it
# inherits the `keycloak` parent theme's upstream English unchanged — do not
# add keys here for flows this realm doesn't use (see
# docs/brand/EMAIL_SYSTEM.md's audit for which those are).
#
# Placeholder positions match the base theme exactly: {0}=link, {1}=raw
# linkExpiration, {2}=realm display name, {3}=formatted expiration (e.g.
# "1 hour"). Changing the wording is safe; changing the argument count or
# order is not — the .ftl call site passes exactly these four positionally.

passwordResetSubject=Reset your password
passwordResetBody=A password reset was requested for your {2} account. If this was you, use the link below.\n\n{0}\n\nThe link expires in {3}.\n\nIf you didn''t request this, you can ignore this message — nothing has changed.
passwordResetBodyHtml=<p>A password reset was requested for your {2} account. If this was you, use the link below.</p><p><a href="{0}">Reset your password</a></p><p>The link expires in {3}.</p><p>If you didn''t request this, you can ignore this message — nothing has changed.</p>

emailVerificationSubject=Verify your email
emailVerificationBody=A {2} account was created with this email address. If this was you, use the link below to verify it.\n\n{0}\n\nThe link expires in {3}.\n\nIf you didn''t create this account, you can ignore this message.
emailVerificationBodyHtml=<p>A {2} account was created with this email address. If this was you, use the link below to verify it.</p><p><a href="{0}">Verify your email</a></p><p>The link expires in {3}.</p><p>If you didn''t create this account, you can ignore this message.</p>
