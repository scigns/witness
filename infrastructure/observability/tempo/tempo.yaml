# Tempo — trace storage and the OTLP receiver the Witness application exports to.
#
# Local filesystem backend. For multi-node deployments this becomes S3/MinIO;
# the change is confined to the `storage` block below (ADR-0014).

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # Traces are observational. They are not the audit log — the audit log is
    # hash-chained in Postgres and is retained under the retention policy, not
    # this one. Deleting traces loses debugging ability, never a record.
    block_retention: 48h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
