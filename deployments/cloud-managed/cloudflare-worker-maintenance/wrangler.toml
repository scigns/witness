# Independent maintenance fallback for `app.buildwithwitness.com`.
#
# Two-step rollout, deliberately separated:
#
#   1. Deploy with NO production route bound (as committed below). This
#      publishes the Worker only to its own *.workers.dev URL, where its
#      maintenance-page rendering, 503 status, and KV toggle can all be
#      verified without touching any live Witness hostname.
#   2. Only after that is verified AND explicitly approved, uncomment the
#      `[[routes]]` block below and redeploy. That single change is what
#      actually puts this Worker in front of `app.buildwithwitness.com` — it
#      is the production-change boundary, not step 1.
#
# See this directory's README for the exact KV enable/disable commands and
# the workers.dev verification steps for both.

name = "witness-maintenance"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Bind a KV namespace named MAINTENANCE_KV, created with:
#   wrangler kv namespace create witness-maintenance-mode
# then paste the resulting id below. The single key "MODE" in this
# namespace ("off" | "maintenance" | "auto") is the manual toggle — see
# README.md. Left blank here deliberately: a missing/invalid id is a wrangler
# deploy-time error, not a silent production misconfiguration.
[[kv_namespaces]]
binding = "MAINTENANCE_KV"
id = ""

# Step 2 above. Commented out until explicitly approved — see this
# directory's README, "Enabling the fallback on the production host".
# [[routes]]
# pattern = "app.buildwithwitness.com/*"
# zone_name = "buildwithwitness.com"
