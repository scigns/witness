# Witness — internal pilot, single node.
#
# The smallest deployment that is honestly production: the web application, the
# API, PostgreSQL, a real Keycloak, and a reverse proxy that terminates TLS.
# Nothing else, because nothing else is used yet — see the profile comments in
# `infrastructure/docker/docker-compose.yml` for why the unused services in the
# full stack stay switched off.
#
# Deliberately not Kubernetes. ADR-0013 makes single-node Compose a first-class
# production target, and an internal pilot has no reason to be the exception.
#
# Everything secret comes from the environment. There are no defaults for
# passwords here on purpose: `${VAR:?message}` fails the whole `up` rather than
# quietly starting with a value someone copied out of a README.
#
#   cp .env.example .env    # then fill it in from your secret store
#   docker compose -f deployments/cloud-managed/docker-compose.pilot.yml up -d --build
#
# The first deployment additionally needs, once:
#   docker compose … run --rm api pnpm --filter @witness/api exec prisma migrate deploy
#   docker compose … run --rm -e WITNESS_BOOTSTRAP_… api pnpm bootstrap

name: witness-pilot

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  # ── System of record (ADR-0004, ADR-0011) ──────────────────────────────────
  postgres:
    <<: *common
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-witness}
      POSTGRES_USER: ${POSTGRES_USER:-witness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Consumed by postgres-init/01-keycloak-role.sh on first-time init only —
      # provisions Keycloak's own role and database, separate from Witness's.
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?KEYCLOAK_DB_USER must be set}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # No `ports:`. The database is reachable only from this compose network —
    # publishing 5432 to the host is how an internal database becomes an
    # internet-facing one.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-witness} -d ${POSTGRES_DB:-witness}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Identity (ADR-0007) ────────────────────────────────────────────────────
  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:26.0
    # `--optimized` skips the build step and trusts options baked into the image
    # at build time via `kc.sh build`; the stock image ships none, so KC_DB and
    # KC_HEALTH_ENABLED would be silently ignored (wrong datastore, no health
    # endpoint). Without it, `start` still runs in production mode — it just
    # builds first, same as the base compose's `start-dev` does every time.
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?KEYCLOAK_DB_USER must be set}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set}
      KC_HOSTNAME: ${OIDC_PUBLIC_URL:?OIDC_PUBLIC_URL must be set}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      # Substituted into the realm import — realm-as-code, no localhost.
      WITNESS_OIDC_REDIRECT_URI: ${WITNESS_OIDC_REDIRECT_URI:?WITNESS_OIDC_REDIRECT_URI must be set}
      WITNESS_WEB_ORIGIN: ${WITNESS_WEB_ORIGIN:?WITNESS_WEB_ORIGIN must be set}
      WITNESS_OIDC_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-witness-api}
      WITNESS_REALM_SEED_PASSWORD: ${WITNESS_REALM_SEED_PASSWORD:?WITNESS_REALM_SEED_PASSWORD must be set}
    volumes:
      - ../../infrastructure/docker/init/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'",
        ]
      interval: 20s
      timeout: 10s
      retries: 15

  # ── Application ────────────────────────────────────────────────────────────
  api:
    <<: *common
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      NODE_ENV: production
      WITNESS_DEPLOYMENT_PROFILE: ${WITNESS_DEPLOYMENT_PROFILE:-sovereign}
      WITNESS_INSTANCE_NAME: ${WITNESS_INSTANCE_NAME:?WITNESS_INSTANCE_NAME must be set}
      WITNESS_DATA_RESIDENCY: ${WITNESS_DATA_RESIDENCY:?WITNESS_DATA_RESIDENCY must be set}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WITNESS_API_PORT: 3001
      WITNESS_WEB_ORIGIN: ${WITNESS_WEB_ORIGIN:?WITNESS_WEB_ORIGIN must be set}
      # Where a signed-in browser is sent back to. Defaults to the origin's
      # root; set it when Witness lives under a path.
      WITNESS_WEB_BASE_URL: ${WITNESS_WEB_BASE_URL:-}
      WITNESS_OIDC_REDIRECT_URI: ${WITNESS_OIDC_REDIRECT_URI:?WITNESS_OIDC_REDIRECT_URI must be set}
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER must be set}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-witness-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-witness-api}
      WITNESS_SESSION_TTL_MINUTES: ${WITNESS_SESSION_TTL_MINUTES:-480}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  web:
    <<: *common
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_WITNESS_API_URL: ${NEXT_PUBLIC_WITNESS_API_URL:?NEXT_PUBLIC_WITNESS_API_URL must be set}
        NEXT_PUBLIC_WITNESS_PROFILE: ${WITNESS_DEPLOYMENT_PROFILE:-sovereign}
        # Empty for a dedicated hostname; `/witness` when the application is
        # served under a path on a domain whose root belongs to something else.
        NEXT_PUBLIC_WITNESS_BASE_PATH: ${NEXT_PUBLIC_WITNESS_BASE_PATH:-}
    depends_on:
      api: { condition: service_started }

  # ── TLS termination, direct topology ───────────────────────────────────────
  # Caddy because it obtains and renews certificates itself. The alternative is
  # a cron job nobody notices has stopped until a Monday morning.
  #
  # Only for a host that is itself reachable from the internet. Behind a
  # Cloudflare Tunnel this service must stay down: Cloudflare terminates TLS,
  # and an ACME challenge cannot reach a host with no inbound ports.
  #
  #   docker compose … --profile direct up -d       ← public IP, ports 80/443
  #   docker compose … --profile cloudflare up -d   ← tunnel, nothing published
  proxy:
    <<: *common
    profiles: ["direct"]
    image: caddy:2-alpine
    environment:
      # Defaulted rather than required, because Compose interpolates every
      # service before it filters by profile: a hard `:?` here aborts
      # `--profile cloudflare` over three variables Caddy-only variables the
      # tunnel never uses. Left empty the Caddyfile has no site address and
      # Caddy refuses to start, so the `direct` profile still fails loudly —
      # one container at startup instead of the whole file at parse time.
      WITNESS_WEB_HOST: ${WITNESS_WEB_HOST:-}
      WITNESS_API_HOST: ${WITNESS_API_HOST:-}
      WITNESS_OIDC_HOST: ${WITNESS_OIDC_HOST:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports: ["80:80", "443:443"]
    depends_on:
      web: { condition: service_started }
      api: { condition: service_started }
      keycloak: { condition: service_healthy }

  # ── Public ingress, Cloudflare topology ────────────────────────────────────
  # The connector dials out to Cloudflare; nothing dials in. The host needs no
  # public IP, no open port and no certificate, and PostgreSQL cannot be
  # reached from outside this network at all because it has no ingress rule.
  cloudflared:
    <<: *common
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    # QUIC (the default) runs over UDP, which home/office networks throttle,
    # NAT-time-out, or drop far more often than they do TCP — observed here as
    # recurring "no recent network activity" disconnects that self-healed
    # within a second but landed mid-request often enough to break a scripted
    # walkthrough. HTTP/2 over TCP/443 is slower per-connection but goes
    # through the same path as every other HTTPS request this host makes,
    # which is the path that's actually reliable on this network.
    command: ["tunnel", "--protocol", "http2", "--config", "/etc/cloudflared/config.yml", "run"]
    environment:
      CLOUDFLARE_TUNNEL_ID: ${CLOUDFLARE_TUNNEL_ID:?CLOUDFLARE_TUNNEL_ID must be set}
    volumes:
      # Rendered from cloudflared/config.yml with the tunnel id substituted —
      # see docs/operations/PILOT_OPERATIONS.md.
      - ./cloudflared:/etc/cloudflared:ro
    # No `ports:`. That is the entire point.
    depends_on:
      web: { condition: service_started }
      api: { condition: service_started }
      keycloak: { condition: service_healthy }

volumes:
  postgres-data: # BACKED UP — the system of record (scripts/ops/backup.sh)
  caddy-data: # certificates and their private keys
  caddy-config:

networks:
  default:
    name: witness-pilot
